<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/SRM_Institute_of_Science_and_Technology_Logo.svg.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEPS 2.0 | Student Engineering Project System - SRM IST</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="font-sans antialiased text-slate-900 bg-white selection:bg-blue-600 selection:text-white">
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
        <div style="background: rgba(255, 255, 255, 0.95); padding: 2.5rem 3rem; border-radius: 1.5rem; border: 2px solid #0f172a; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; align-items: center; gap: 1rem;">
          <svg viewBox="0 0 100 100" width="80" height="80">
            <style>
              @keyframes preloaderCW { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
              @keyframes preloaderCCW { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
            </style>
            <!-- Ring 1: Electric Blue -->
            <g style="transform-origin: 50px 50px; animation: preloaderCW 5.6s linear infinite;">
              <circle cx="92" cy="50" r="2.7" fill="#007DFF" />
              <circle cx="88.3" cy="62.5" r="2.7" fill="#007DFF" />
              <circle cx="78.1" cy="72.7" r="2.7" fill="#007DFF" />
              <circle cx="64.5" cy="78.6" r="2.7" fill="#007DFF" />
              <circle cx="50" cy="80.6" r="2.7" fill="#007DFF" />
              <circle cx="35.5" cy="78.6" r="2.7" fill="#007DFF" />
              <circle cx="21.9" cy="72.7" r="2.7" fill="#007DFF" />
              <circle cx="11.7" cy="62.5" r="2.7" fill="#007DFF" />
              <circle cx="8" cy="50" r="2.7" fill="#007DFF" />
              <circle cx="11.7" cy="37.5" r="2.7" fill="#007DFF" />
              <circle cx="21.9" cy="27.3" r="2.7" fill="#007DFF" />
              <circle cx="35.5" cy="21.4" r="2.7" fill="#007DFF" />
              <circle cx="50" cy="19.4" r="2.7" fill="#007DFF" />
              <circle cx="64.5" cy="21.4" r="2.7" fill="#007DFF" />
              <circle cx="78.1" cy="27.3" r="2.7" fill="#007DFF" />
              <circle cx="88.3" cy="37.5" r="2.7" fill="#007DFF" />
            </g>
            <!-- Ring 2: Sunlight Gold Yellow -->
            <g style="transform-origin: 50px 50px; animation: preloaderCCW 4.8s linear infinite;">
              <circle cx="84" cy="50" r="2.5" fill="#FFC700" />
              <circle cx="79.4" cy="67" r="2.5" fill="#FFC700" />
              <circle cx="67" cy="79.4" r="2.5" fill="#FFC700" />
              <circle cx="50" cy="84" r="2.5" fill="#FFC700" />
              <circle cx="33" cy="79.4" r="2.5" fill="#FFC700" />
              <circle cx="20.6" cy="67" r="2.5" fill="#FFC700" />
              <circle cx="16" cy="50" r="2.5" fill="#FFC700" />
              <circle cx="20.6" cy="33" r="2.5" fill="#FFC700" />
              <circle cx="33" cy="20.6" r="2.5" fill="#FFC700" />
              <circle cx="50" cy="16" r="2.5" fill="#FFC700" />
              <circle cx="67" cy="20.6" r="2.5" fill="#FFC700" />
              <circle cx="79.4" cy="33" r="2.5" fill="#FFC700" />
            </g>
            <!-- Ring 3: Cyan Sky Blue -->
            <g style="transform-origin: 50px 50px; animation: preloaderCW 4.0s linear infinite;">
              <circle cx="76" cy="50" r="2.3" fill="#00B4D8" />
              <circle cx="68.4" cy="68.4" r="2.3" fill="#00B4D8" />
              <circle cx="50" cy="76" r="2.3" fill="#00B4D8" />
              <circle cx="31.6" cy="68.4" r="2.3" fill="#00B4D8" />
              <circle cx="24" cy="50" r="2.3" fill="#00B4D8" />
              <circle cx="31.6" cy="31.6" r="2.3" fill="#00B4D8" />
              <circle cx="50" cy="24" r="2.3" fill="#00B4D8" />
              <circle cx="68.4" cy="31.6" r="2.3" fill="#00B4D8" />
            </g>
            <!-- Ring 4: Amber Honey Yellow -->
            <g style="transform-origin: 50px 50px; animation: preloaderCCW 3.2s linear infinite;">
              <circle cx="68" cy="50" r="2.1" fill="#FF9E00" />
              <circle cx="59" cy="65.6" r="2.1" fill="#FF9E00" />
              <circle cx="41" cy="65.6" r="2.1" fill="#FF9E00" />
              <circle cx="32" cy="50" r="2.1" fill="#FF9E00" />
              <circle cx="41" cy="34.4" r="2.1" fill="#FF9E00" />
              <circle cx="59" cy="34.4" r="2.1" fill="#FF9E00" />
            </g>
            <!-- Center Bead -->
            <circle cx="50" cy="50" r="2.6" fill="#FFD000" />
          </svg>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span style="display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 9999px; background: #fbbf24;"></span>
            <p style="margin: 0; font-size: 0.8125rem; font-weight: 800; color: #0f172a; letter-spacing: 0.025em;">Loading SEPS Portal...</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
